<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarryFS</title>
<meta name="description" content="An experimental filesystem for the backup disk you carry between macOS, Linux and Windows.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/favicon.ico" sizes="32x32">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root {
    --paper: #fff;
    --ink: #111;
    --muted: #5c5c5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #111;
      --ink: #fff;
      --muted: #a3a3a3;
    }
  }

  * { margin: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    box-sizing: border-box;
    background: var(--paper);
    color: var(--ink);
    font: 400 1.125rem/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    display: grid;
    justify-items: center;
    gap: 2.5rem;
    text-align: center;
  }

  h1 { line-height: 0; }
  .logo { width: min(15rem, 60vw); height: auto; fill: currentColor; }
  .logo .paper { fill: var(--paper); }
  .logo .line { fill: none; stroke: currentColor; stroke-width: 8; stroke-miterlimit: 4; }

  p {
    max-width: 30ch;
    color: var(--muted);
    text-wrap: balance;
  }

  a {
    display: inline-flex;
    align-items: center;
    gap: .5em;
    color: inherit;
    font-size: 1rem;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: .3em;
  }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 2px; }
  a svg { width: 1.1em; height: 1.1em; fill: currentColor; }

  /* The one moment of motion: the cube's outline draws, then its ink faces settle in. */
  @media (prefers-reduced-motion: no-preference) {
    .line { animation: draw 1.1s cubic-bezier(.65, 0, .35, 1) backwards; }
    .line.y { animation-delay: .45s; }
    .line.v { animation-delay: .75s; }
    .ink { animation: settle .5s ease-out 1.2s backwards; }
  }
  @keyframes draw {
    from { stroke-dasharray: 1; stroke-dashoffset: 1; }
    to { stroke-dasharray: 1; stroke-dashoffset: 0; }
  }
  @keyframes settle { from { opacity: 0; } }
</style>
</head>
