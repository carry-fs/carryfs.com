<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarryFS</title>
<meta name="description" content="An experimental filesystem for the backup disk you carry between macOS, Linux and Windows.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/favicon.ico" sizes="32x32">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root {
    --paper: #fff;
    --ink: #111;
    --muted: #5c5c5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #111;
      --ink: #fff;
      --muted: #a3a3a3;
    }
  }

  * { margin: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    box-sizing: border-box;
    background: var(--paper);
    color: var(--ink);
    font: 400 1.125rem/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    display: grid;
    justify-items: center;
    gap: 2.5rem;
    text-align: center;
  }

  h1 { line-height: 0; }
  .logo { width: min(15rem, 60vw); height: auto; fill: currentColor; }
  .logo .paper { fill: var(--paper); }
  .logo .line { fill: none; stroke: currentColor; stroke-width: 8; stroke-miterlimit: 4; }

  p {
    max-width: 30ch;
    color: var(--muted);
    text-wrap: balance;
  }

  a {
    display: inline-flex;
    align-items: center;
    gap: .5em;
    color: inherit;
    font-size: 1rem;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: .3em;
  }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 2px; }
  a svg { width: 1.1em; height: 1.1em; fill: currentColor; }

  /* The one moment of motion: the cube's outline draws, then its ink faces settle in. */
  @media (prefers-reduced-motion: no-preference) {
    .line { animation: draw 1.1s cubic-bezier(.65, 0, .35, 1) backwards; }
    .line.y { animation-delay: .45s; }
    .line.v { animation-delay: .75s; }
    .ink { animation: settle .5s ease-out 1.2s backwards; }
  }
  @keyframes draw {
    from { stroke-dasharray: 1; stroke-dashoffset: 1; }
    to { stroke-dasharray: 1; stroke-dashoffset: 0; }
  }
  @keyframes settle { from { opacity: 0; } }

  /* The duck walks, swims and flies a file across. Click to poke it: it drops the file and
     sulks, then picks the file back up after a few seconds (or on the next click). */
  .scene {
    display: block;
    width: min(30rem, 100vw - 2rem);
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    cursor: pointer;
  }
  .scene:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 2px; }
  .scene svg { display: block; width: 100%; height: auto; overflow: visible; fill: currentColor; }
  .scene .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .scene .paper { fill: var(--paper); }
  .scene .wing { stroke: var(--paper); stroke-width: 1.2; stroke-linejoin: round; }
  .scene .brow { stroke: var(--paper); stroke-width: 1.3; stroke-linecap: round; }
</style>
</head>
<body>
<main>
  <h1>

      </g>
      <path d="M38.281,0.984 C54.344,0.984 66.062,-9.188 68.312,-23.578 L57.078,-23.578 C55.219,-14.312 47.469,-9.188 38.375,-9.188 C25.922,-9.188 16.547,-18.656 16.547,-36.328 C16.547,-53.906 25.875,-63.578 38.375,-63.578 C47.469,-63.578 55.219,-58.500 57.078,-49.219 L68.266,-49.219 C65.828,-64.656 53.609,-73.734 38.281,-73.734 C19.438,-73.734 5.516,-59.672 5.516,-36.328 C5.516,-13.094 19.391,0.984 38.281,0.984 Z M95.855,1.219 C104.684,1.219 109.871,-3.219 111.965,-7.469 L112.496,-7.469 L112.496,-0.000 L122.902,-0.000 L122.902,-36.234 C122.902,-52.000 110.355,-55.281 101.559,-55.281 C91.840,-55.281 82.668,-51.469 78.949,-41.703 L89.059,-39.062 C90.574,-42.781 94.574,-46.531 101.715,-46.531 C108.543,-46.531 112.152,-43.016 112.152,-36.969 L112.152,-36.672 C112.152,-32.812 108.012,-32.859 98.387,-31.734 C88.090,-30.562 77.387,-27.828 77.387,-15.438 C77.387,-4.688 85.449,1.219 95.855,1.219 Z M98.246,-7.422 C92.230,-7.422 87.934,-10.109 87.934,-15.281 C87.934,-20.906 92.918,-22.953 98.980,-23.781 C102.293,-24.219 110.590,-25.094 112.215,-26.656 L112.215,-19.672 C112.215,-13.281 106.980,-7.422 98.246,-7.422 Z M137.361,-0.000 L148.096,-0.000 L148.096,-33.156 C148.096,-40.328 153.564,-45.406 161.080,-45.406 C163.330,-45.406 165.924,-45.016 166.705,-44.828 L166.705,-55.078 C165.580,-55.219 163.533,-55.375 162.158,-55.375 C155.768,-55.375 150.346,-51.766 148.346,-45.797 L147.752,-45.797 L147.752,-54.594 L137.361,-54.594 L137.361,-0.000 Z M176.033,-0.000 L186.768,-0.000 L186.768,-33.156 C186.768,-40.328 192.236,-45.406 199.752,-45.406 C202.002,-45.406 204.596,-45.016 205.377,-44.828 L205.377,-55.078 C204.252,-55.219 202.205,-55.375 200.830,-55.375 C194.439,-55.375 189.018,-51.766 187.018,-45.797 L186.424,-45.797 L186.424,-54.594 L176.033,-54.594 L176.033,-0.000 Z M213.971,19.625 C215.283,20.219 218.111,20.797 221.486,20.797 C230.268,20.797 235.689,16.312 239.018,7.562 L262.752,-54.594 L251.221,-54.594 L240.236,-23.578 C238.533,-18.844 237.299,-14.109 236.080,-9.422 C234.908,     </svg>
  </h1>
  <p>An experimental filesystem for the backup disk you carry between macOS, Linux and Windows.</p>
  <button class="scene" type="button" aria-label="Interrupt the copy" aria-pressed="false">
    <svg id="scene-art" viewBox="0 0 480 120" aria-hidden="true">
      <defs>
        <!-- The logo cube. Inline styles: page CSS doesn't reach into <use> copies. -->
        <g id="cube">
          <path style="fill:var(--paper)" d="M0-9 8-4.5v9L0 9-8 4.5v-9Z"/>
          <path d="M0-9 8-4.5 0 0-8-4.5ZM0 0 2.5-1.4v9L0 9Z"/>
          <path style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round" d="M0-9 8-4.5v9L0 9-8 4.5v-9ZM-8-4.5 0 0 8-4.5M0 0v9"/>
        </g>
        <clipPath id="pond"><rect x="150" y="80" width="200" height="50"/></clipPath>
      </defs>
      <path class="stroke" d="M4 104H148l12 16M350 120V56H476"/>
      <use href="#cube" x="16" y="95"/>
      <use href="#cube" x="32" y="95"/>
      <use href="#cube" x="24" y="81.5"/>
      <use href="#cube" x="48" y="95" id="source"/>
      <use href="#cube" x="432" y="47" id="target"/>
      <use href="#cube" x="448" y="47"/>
      <use href="#cube" x="464" y="47"/>
      <use href="#cube" x="456" y="33.5"/>
      <use href="#cube" id="loose"/>
      <!-- Facing right, feet at 0,0. The cube hangs from the bill tip (21,-23).
           The wing is drawn folded back from its shoulder at 0,0; JS places it (4,-15 folded). -->
      <g id="duck">
        <g id="duck-body">
          <path id="leg-a" class="stroke" d="M0 0v6h3"/>
          <path id="leg-b" class="stroke" d="M0 0v6h3"/>

  <a href="https://github.com/carry-fs/carryfs">

    Source on GitHub

</main>
<script>
  const io = p => (1 - Math.cos(Math.PI * p)) / 2;
  const out = p => Math.sin(Math.PI * p / 2);
  const lin = p => p;
  const clamp = v => Math.min(Math.max(v, 0), 1);

  // Motion is a track of steps. Each step eases the props it lists from where the previous
  // step left them; gait props (legs, wings, bobbing) blend over its first .3s instead.
  // x/y are the duck's feet, sx its facing (flips halfway through a turn), arc lifts y
  // mid-step. head 18 puts the hanging cube on the ground. `mark` names a step's end time.
  const GAIT = ['step', 'bob', 'flap', 'legs', 'wing'];
  function build(pose, steps) {
    let T = 0;
    const marks = {};
    const track = steps.map(({ d, ease = io, arc = 0, mark, ...to }) => {
      const step = { t: T, d, ease, arc, from: pose, to: pose = { ...pose, ...to } };
      T += d;
      if (mark) marks[mark] = T;
      return step;
    });
    return { track, T, marks };
  }
  const stepAt = ({ track }, t) => track.findLast(k => k.t <= t);
  // The pose at time t; a track holds its last pose once it ends.
  function sample(track, t) {
    const k = stepAt(track, t);
    const r = Math.min((t - k.t) / k.d, 1), p = k.ease(r), g = io(clamp((t - k.t) / Math.min(k.d, .3)));
    const v = {};
    for (const key in k.to) v[key] = k.from[key] + (k.to[key] - k.from[key]) * (GAIT.includes(key) ? g : p);
    v.y -= k.arc * Math.sin(Math.PI * r);
    return v;
  }

  // The trip ends where it starts.
  const TRIP = build({ x: 69, y: 104, sx: -1, tilt: 0, head: 18, wing: 0, step: 0, bob: 0, flap: 0, legs: 1, anger: 0 }, [
    { d: .5, head: -15 },                                                     // grab, lift the cube
    { d: .3, sx: 1, x: 76, arc: 4 },                                          // hop around
    { d: 2.2, x: 148, step: 1, ease: lin },                                   // walk to the water
    { d: .6, x: 166, y: 115, step: 0, bob: 1 },                               // wade in
    { d: 3.6, x: 300, ease: lin },                                            // swim
    { d: 1.1, x: 366, y: 46, tilt: -14, wing: 65, flap: 1, bob: 0, legs: 0, arc: 12 }, // take off
    { d: .5, x: 392, y: 56, tilt: 0, flap: 0, legs: 1, ease: out },           // land, wings up
    { d: .5, x: 411, wing: 0, step: 1, ease: lin },                           // walk to the pile
    { d: .45, head: 18, step: 0, mark: 'drop' },                              // set the cube down
    { d: .3, head: 0 },
    { d: .3, sx: -1, x: 402, arc: 4 },                                        // hop around
    { d: 1.5, x: 290, y: 115, tilt: 8, wing: 65, flap: 1, legs: 0, arc: 40 }, // fly down to the water
    { d: .4, x: 282, tilt: 0, wing: 0, flap: 0, bob: 1, ease: out },          // splash down
    { d: 3.2, x: 166, ease: lin },                                            // swim back
    { d: .6, x: 148, y: 104, bob: 0, legs: 1, step: 1 },                      // wade out
    { d: 2, x: 69, ease: lin },                                               // walk home
    { d: .5, step: 0, head: 18 },                                             // reach for the next cube
  ]);

  const el = id => document.getElementById(id);
  const [svg, duck, body, legA, legB, wing, head, held, loose, scowl, vein, source, target, waves] =
    ['scene-art', 'duck', 'duck-body', 'leg-a', 'leg-b', 'wing', 'head', 'held', 'loose', 'scowl', 'vein', 'source', 'target', 'waves'].map(el);

  // Clocks: `trip` drives the trip and stops while the duck sulks; `now` drives gait and waves.
  // `poke` is the interruption: the flinch-and-sulk track, then the recovery track back into the trip.
  // The duck sulks for SULK seconds after a poke, or until the next click.
  const SULK = 3;
  let trip, now, poke = null; // clocks start below, once the motion preference is known

  function startPoke() {
    const t = trip % TRIP.T, v = sample(TRIP, t);
    let cube = null;
    if (t < TRIP.marks.drop) {
      // The cube falls from the bill to where the duck's grab pose (head 18) reaches it again.
      const r = held.getBoundingClientRect();
      const from = new DOMPoint(r.x + r.width / 2, r.y + r.height / 2).matrixTransform(svg.getScreenCTM().inverse());
      cube = { from, to: { x: v.x + (v.sx < 0 ? -21.15 : 21.15), y: v.y - 9 } };
    }
    poke = {
      at: now, cube, track: build(v, [
        { d: .2, y: v.y - 4, wing: 50, anger: 1, step: 0, bob: 0, ease: out }, // flinch
        { d: .15, y: v.y, wing: 0 },
        { d: .1, y: v.y - 2 }, { d: .1, y: v.y },                              // stamp
        { d: .1, y: v.y - 2 }, { d: .1, y: v.y },                              // stamp
        { d: .3, head: -25 },                                                  // bill up, sulk
      ]),
    };
  }
  function recover() {
    const v = sample(poke.track, now - poke.at), back = sample(TRIP, trip % TRIP.T);
    poke.back = now;
    poke.recover = build(v, poke.cube
      ? [{ d: .35, head: 18, anger: 0, mark: 'grab' }, { d: .35, ...back }]  // pick the cube up again
      : [{ d: .3, ...back }]);
  }

  function draw() {
    const t = trip % TRIP.T;
    let v = sample(TRIP, t), carrying = t < TRIP.marks.drop, dropped = null;
    if (poke) {
      v = poke.recover ? sample(poke.recover, now - poke.back) : sample(poke.track, now - poke.at);
      const regrabbed = poke.recover && now - poke.back >= poke.recover.marks.grab;
      if (poke.cube && !regrabbed) {
        const f = clamp((now - poke.at) / .3), { from, to } = poke.cube;
        dropped = [from.x + (to.x - from.x) * f, from.y + (to.y - from.y) * f * f];
        carrying = false;
      }
    }

    const stride = Math.sin(2 * Math.PI * now / .34);
    const swing = 26 * v.step * stride;
    const y = v.y - 1.2 * v.step * Math.abs(stride) + .8 * v.bob * Math.sin(2 * Math.PI * now / 1.3);
    const tuck = 75 * (1 - v.legs), len = .4 + .6 * v.legs;
    duck.setAttribute('transform', `translate(${v.x} ${y}) scale(${v.sx < 0 ? -1 : 1} 1)`);
    body.setAttribute('transform', `rotate(${v.tilt + 2 * v.step * stride} 0 -13)`);
    legA.setAttribute('transform', `translate(-3 -6) rotate(${tuck + swing}) scale(1 ${len})`);
    legB.setAttribute('transform', `translate(2 -6) rotate(${tuck - swing}) scale(1 ${len})`);
    // Raising the wing slides its shoulder back from under the head and spreads it. A flap
    // sweeps it 105° down, foreshortened mid-stroke where it points toward us.
    const lift = clamp(v.wing / 65), down = v.flap * (1 - Math.cos(2 * Math.PI * now / .3)) / 2;
    const reach = (1 + .25 * lift) * (1 - .4 * Math.sin(Math.PI * down));
    wing.setAttribute('transform', `translate(${4 - 6 * lift} ${-15 - 3 * lift}) rotate(${v.wing - 105 * down}) scale(${reach} ${1 + .3 * lift})`);
    head.setAttribute('transform', `rotate(${v.head} 5 -20)`);
    held.setAttribute('transform', `rotate(${-v.head} 21 -23)`);    // hangs straight down from the bill
    held.style.visibility = carrying ? '' : 'hidden';
    loose.style.visibility = dropped ? '' : 'hidden';
    if (dropped) loose.setAttribute('transform', `translate(${dropped})`);
    scowl.style.opacity = vein.style.opacity = v.anger;
    source.style.opacity = clamp((t - 6) / .6);                     // a new file appears at the source
    target.style.opacity = t < TRIP.marks.drop ? 0 : 1 - clamp((t - 15) / .6); // the delivered one fades out
    waves.setAttribute('transform', `translate(${-8 * (now % 2)} 0)`);
  }

  const scene = document.querySelector('.scene');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const seek = new URLSearchParams(location.search).get('t'); // ?t=8.5 freezes that moment
  let running = false, queued = false, last, raf = 0;
  trip = now = seek ? +seek : reduce.matches ? 7 : TRIP.T - .5;

  // A poke waits until the duck is on the ground or water: no flying or hopping step.
  const grounded = () => { const k = stepAt(TRIP, trip % TRIP.T); return !k.arc && !k.from.flap && !k.to.flap; };
  const setPressed = () => scene.setAttribute('aria-pressed', !!poke || !running);

  function tick(ms) {
    const dt = Math.min(ms - (last ?? ms), 100) / 1000; // cap the step after a backgrounded tab
    last = ms;
    now += dt;
    if (!poke) trip += dt;
    if (poke && !poke.recover && now - poke.at >= SULK) recover();
    if (poke?.recover && now - poke.back >= poke.recover.T) { poke = null; setPressed(); }
    if (!poke && queued && grounded()) { queued = false; startPoke(); setPressed(); }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function play(on) {
    cancelAnimationFrame(raf);
    running = on;
    last = undefined;
    if (on) raf = requestAnimationFrame(tick);
    setPressed();
  }
  scene.addEventListener('click', () => {
    if (poke && !poke.recover) recover();
    else if (running) queued = true;
    play(true);
  });
  reduce.addEventListener('change', () => play(!reduce.matches));
  draw();
  play(!seek && !reduce.matches);
</script>
</body>
</html>
